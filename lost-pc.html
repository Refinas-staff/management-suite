function master(id){return masters.find(x=>x.id===id)} function name(id,f='—'){return master(id)?.name||f} function type(t,active=false){return masters.filter(x=>x.master_type===t&&(!active||x.is_active)).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)||a.name.localeCompare(b.name,'ja'))}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2100)}
function demoLoad(){let saved={};try{saved=JSON.parse(localStorage.getItem(demoKey)||'{}')}catch{} masters=saved.masters||structuredClone(seedMasters);items=saved.items||structuredClone(seedItems);settings=saved.settings||{normal_retention_days:90,valuable_retention_days:7,image_max_px:1200,image_quality:.75,photo_retention_days:180};profile={display_name:'本部管理者',role:'admin'}; $('demoBadge').classList.remove('hidden')}
function demoSave(){localStorage.setItem(demoKey,JSON.stringify({masters,items,settings}))}
async function supaInit(){if(!C.SUPABASE_URL||!C.SUPABASE_PUBLISHABLE_KEY) return showConfig(); db=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY); const {data:{session}}=await db.auth.getSession(); if(!session)return showAuth(); await loadProfile(session.user.id); await loadAll(); showApp(); db.auth.onAuthStateChange(async(_e,s)=>{if(!s){showAuth()} });}
async function loadProfile(uid){const {data,error}=await db.from('profiles').select('display_name,role').eq('id',uid).single();if(error)throw error;profile=data;if(!['admin','lost_manager'].includes(profile.role))throw new Error('このアカウントにはPC忘れ物管理の権限がありません。')}
async function loadAll(){const [m,i,s]=await Promise.all([db.from('master_records').select('*').order('sort_order'),db.from('lost_items').select('*').order('created_at',{ascending:false}),db.from('app_settings').select('key,value')]);if(m.error)throw m.error;if(i.error)throw i.error;if(s.error)throw s.error;masters=m.data||[];items=i.data||[];settings=Object.fromEntries((s.data||[]).map(x=>[x.key,x.value]));}
function showAuth(){ $('authLayer').classList.remove('hidden');$('app').classList.add('hidden') } function showApp(){ $('authLayer').classList.add('hidden');$('app').classList.remove('hidden');applyRole();renderAll() }
function showConfig(){$('authLayer').classList.add('hidden');document.body.insertAdjacentHTML('beforeend','<div class="config-error"><div class="config-card"><h1>Supabase設定が必要です</h1><p><code>HTML内の APP_CONFIG</code>にプロジェクトURLとPublishable keyを設定してください。画面だけ確認する場合は<code>DEMO_MODE: true</code>にします。</p></div></div>')}
function applyRole(){const admin=profile.role==='admin';qsa('[data-admin-only]').forEach(e=>e.classList.toggle('hidden',!admin));$('profileName').textContent=profile.display_name||'ユーザー';$('profileRole').textContent=profile.role;$('roleChip').textContent=admin?'管理者':'ステータス管理'}
function populateFilters(){const stores=type('store',true),cats=type('category',true);$('storeFilter').innerHTML='<option value="">すべての店舗</option>'+stores.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('categoryFilter').innerHTML='<option value="">すべてのカテゴリ</option>'+cats.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}
function statusClass(s){return s==='保管中'?'s-blue':s==='問い合わせあり'?'s-orange':s==='返却済み'?'s-green':'s-gray'}
function filtered(){let a=[...items],q=$('searchInput').value.trim().toLowerCase();if(q)a=a.filter(x=>[x.management_no,x.item_name,x.color,x.features,x.notes].join(' ').toLowerCase().includes(q));if($('storeFilter').value)a=a.filter(x=>x.store_id===$('storeFilter').value);if($('categoryFilter').value)a=a.filter(x=>x.category_id===$('categoryFilter').value);if($('statusFilter').value)a=a.filter(x=>x.status===$('statusFilter').value);const sort=$('sortFilter').value;a.sort((x,y)=>sort==='oldest'?new Date(x.created_at)-new Date(y.created_at):sort==='expiry'?String(x.expiry_date||'9999').localeCompare(String(y.expiry_date||'9999')):new Date(y.created_at)-new Date(x.created_at));return a}
function renderItems(){const a=filtered();$('resultCount').textContent=a.length+'件';$('itemsBody').innerHTML=a.map(x=>{const cat=master(x.category_id);return`<tr data-id="${x.id}"><td><div class="item-cell"><div class="thumb" data-photo="${esc(x.photo_path||'')}">${esc(cat?.metadata?.emoji||'□')}</div><div><strong>${esc(x.item_name)}</strong><small>${esc(x.color||'色未登録')}</small></div></div></td><td><strong>${esc(x.management_no||'発行中')}</strong></td><td>${esc(name(x.store_id))}<br><span class="muted">${esc(name(x.found_location_id))}</span></td><td>${fmt(x.found_at,true)}</td><td>${fmt(x.expiry_date)}</td><td><span class="status ${statusClass(x.status)}">${esc(x.status)}</span></td><td><button class="icon-button row-open">›</button></td></tr>`}).join('');$('emptyItems').classList.toggle('hidden',a.length>0);qsa('#itemsBody tr').forEach(tr=>tr.onclick=()=>openDrawer(tr.dataset.id));hydratePhotos()}
async function photoUrl(path){if(!path||C.DEMO_MODE)return null;if(signedCache.has(path))return signedCache.get(path);const {data,error}=await db.storage.from(C.STORAGE_BUCKET||'lost-item-images').createSignedUrl(path,3600);if(error)return null;signedCache.set(path,data.signedUrl);return data.signedUrl}
async function hydratePhotos(){for(const el of qsa('[data-photo]')){const path=el.dataset.photo;if(!path)continue;const url=await photoUrl(path);if(url)el.innerHTML=`<img src="${url}" alt="">`}}
async function openDrawer(id){selected=items.find(x=>x.id===id);if(!selected)return;const cat=master(selected.category_id);const url=await photoUrl(selected.photo_path);$('drawerBody').innerHTML=`<div class="drawer-photo">${url?`<img src="${url}" alt="忘れ物写真">`:esc(cat?.metadata?.emoji||'□')}</div><div class="drawer-title"><div><h2>${esc(selected.item_name)}</h2><p class="muted">${esc(selected.management_no)}</p></div><span class="status ${statusClass(selected.status)}">${esc(selected.status)}</span></div><div class="detail-grid"><div class="detail-cell"><span>店舗</span><strong>${esc(name(selected.store_id))}</strong></div><div class="detail-cell"><span>カテゴリ</span><strong>${esc(name(selected.category_id))}</strong></div><div class="detail-cell"><span>発見場所</span><strong>${esc(name(selected.found_location_id))}</strong></div><div class="detail-cell"><span>保管場所</span><strong>${esc(name(selected.storage_location_id))}</strong></div><div class="detail-cell"><span>発見日時</span><strong>${fmt(selected.found_at,true)}</strong></div><div class="detail-cell"><span>保管期限</span><strong>${fmt(selected.expiry_date)}</strong></div></div><section class="drawer-section"><h3>特徴・備考</h3><p>${esc(selected.features||selected.notes||'登録なし')}</p></section><section class="drawer-section"><h3>ステータス変更</h3><div class="status-control"><select id="drawerStatus">${STATUS.map(s=>`<option ${s===selected.status?'selected':''}>${s}</option>`).join('')}</select><button id="saveStatus" class="button primary">変更する</button></div></section>`;$('overlay').classList.add('open');$('drawer').classList.add('open');$('saveStatus').onclick=saveStatus}
function closeDrawer(){$('overlay').classList.remove('open');$('drawer').classList.remove('open')}
async function saveStatus(){const status=$('drawerStatus').value;try{if(C.DEMO_MODE){selected.status=status;demoSave()}else{const {error}=await db.from('lost_items').update({status}).eq('id',selected.id);if(error)throw error;selected.status=status}renderItems();closeDrawer();toast('ステータスを変更しました')}catch(e){toast(e.message||'更新できませんでした')}}
const masterViewMap={stores:['store','店舗管理','店舗'],categories:['category','カテゴリ管理','カテゴリ'],found:['found_location','発見場所管理','発見場所'],storage:['storage_location','保管場所管理','保管場所']};
function renderMasterView(view){const [t,title,label]=masterViewMap[view];const target=$('view-'+view);const rows=type(t).map(x=>`<div class="master-row"><div><strong>${esc(x.name)}</strong><div class="muted">${esc(x.code||x.metadata?.area||'')}</div></div><div>${esc(x.parent_id?name(x.parent_id):'全店舗共通')}</div><div>${x.sort_order||0}</div><div><button class="switch ${x.is_active?'s-green':'s-gray'}" data-toggle="${x.id}">${x.is_active?'有効':'無効'}</button></div><div><button class="button secondary edit-master" data-id="${x.id}">編集</button></div></div>`).join('');target.innerHTML=`<div class="section-heading"><div><p class="eyebrow">MASTER DATA</p><h2>${title}</h2><p>${label}を共通マスターテーブルで管理します。</p></div><button class="button primary add-master" data-type="${t}">＋ ${label}を追加</button></div><section class="panel master-list"><div class="master-row header"><div>名称</div><div>対象店舗</div><div>表示順</div><div>状態</div><div></div></div>${rows||'<div class="empty">登録がありません。</div>'}</section>`;target.querySelector('.add-master').onclick=e=>openMaster(e.currentTarget.dataset.type);target.querySelectorAll('.edit-master').forEach(b=>b.onclick=()=>openMaster(t,b.dataset.id));target.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggleMaster(b.dataset.toggle))}
function openMaster(t,id=''){const x=masters.find(m=>m.id===id);$('masterId').value=id;$('masterType').value=t;$('masterModalTitle').textContent=x?'マスターを編集':'マスターを追加';$('masterCode').value=x?.code||'';$('masterArea').value=x?.metadata?.area||'';$('masterName').value=x?.name||'';$('masterEmoji').value=x?.metadata?.emoji||'';$('masterParent').innerHTML='<option value="">全店舗共通</option>'+type('store',true).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');$('masterParent').value=x?.parent_id||'';$('masterSort').value=x?.sort_order??10;$('masterActive').value=String(x?.is_active??true);$('codeField').classList.toggle('hidden',t!=='store');$('areaField').classList.toggle('hidden',t!=='store');$('emojiField').classList.toggle('hidden',t!=='category');$('parentField').classList.toggle('hidden',!['found_location','storage_location'].includes(t));$('masterModal').classList.add('open')}
function closeMaster(){$('masterModal').classList.remove('open')}
async function saveMaster(e){e.preventDefault();const id=$('masterId').value,t=$('masterType').value;const rec={master_type:t,name:$('masterName').value.trim(),code:t==='store'?$('masterCode').value.trim()||null:null,parent_id:['found_location','storage_location'].includes(t)?$('masterParent').value||null:null,sort_order:Number($('masterSort').value)||0,is_active:$('masterActive').value==='true',metadata:t==='store'?{area:$('masterArea').value.trim()}:t==='category'?{emoji:$('masterEmoji').value.trim()}: {}};try{if(C.DEMO_MODE){if(id){Object.assign(masters.find(x=>x.id===id),rec)}else masters.push({id:'m'+Date.now(),...rec});demoSave()}else{let q=db.from('master_records');const {data,error}=id?await q.update(rec).eq('id',id).select().single():await q.insert(rec).select().single();if(error)throw error;if(id)Object.assign(masters.find(x=>x.id===id),data);else masters.push(data)}closeMaster();renderMasterView(viewFromType(t));populateFilters();toast('保存しました')}catch(e){toast(e.message||'保存できませんでした')}}
function viewFromType(t){return t==='store'?'stores':t==='category'?'categories':t==='found_location'?'found':'storage'}
async function toggleMaster(id){const x=masters.find(m=>m.id===id);if(!x)return;try{if(C.DEMO_MODE){x.is_active=!x.is_active;demoSave()}else{const {error}=await db.from('master_records').update({is_active:!x.is_active}).eq('id',id);if(error)throw error;x.is_active=!x.is_active}renderMasterView(viewFromType(x.master_type));populateFilters()}catch(e){toast(e.message)}}
function loadSettingsUI(){$('settingNormalDays').value=settings.normal_retention_days??90;$('settingValuableDays').value=settings.valuable_retention_days??7;$('settingImageMax').value=settings.image_max_px??1200;$('settingImageQuality').value=settings.image_quality??.75;$('settingPhotoRetention').value=settings.photo_retention_days??180}
async function saveSettings(){const next={normal_retention_days:Number($('settingNormalDays').value),valuable_retention_days:Number($('settingValuableDays').value),image_max_px:Number($('settingImageMax').value),image_quality:Number($('settingImageQuality').value),photo_retention_days:Number($('settingPhotoRetention').value)};try{if(C.DEMO_MODE){settings=next;demoSave()}else{const rows=Object.entries(next).map(([key,value])=>({key,value}));const {error}=await db.from('app_settings').upsert(rows,{onConflict:'key'});if(error)throw error;settings=next}toast('設定を保存しました')}catch(e){toast(e.message)}}
function switchView(v){if(v!=='items'&&profile.role!=='admin')v='items';qsa('.view').forEach(x=>x.classList.toggle('active',x.id==='view-'+v));qsa('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.view===v));const titles={items:'忘れ物一覧',stores:'店舗管理',categories:'カテゴリ管理',found:'発見場所管理',storage:'保管場所管理',settings:'設定'};$('pageTitle').textContent=titles[v];$('breadcrumb').textContent=titles[v];$('sidebar').classList.remove('open');if(masterViewMap[v])renderMasterView(v);if(v==='settings')loadSettingsUI()}
function renderAll(){populateFilters();renderItems();loadSettingsUI()}
function bind(){qsa('.nav-item').forEach(b=>b.onclick=()=>switchView(b.dataset.view));['searchInput'].forEach(id=>$(id).oninput=renderItems);['storeFilter','categoryFilter','statusFilter','sortFilter'].forEach(id=>$(id).onchange=renderItems);$('clearFilters').onclick=()=>{['searchInput','storeFilter','categoryFilter','statusFilter'].forEach(id=>$(id).value='');$('sortFilter').value='newest';renderItems()};$('drawerClose').onclick=closeDrawer;$('overlay').onclick=()=>{closeDrawer();$('sidebar').classList.remove('open')};$('menuButton').onclick=()=>$('sidebar').classList.toggle('open');$('masterModalClose').onclick=closeMaster;$('masterCancel').onclick=closeMaster;$('masterForm').onsubmit=saveMaster;$('saveSettings').onclick=saveSettings;$('loginForm').onsubmit=async e=>{e.preventDefault();$('authError').textContent='';const {error}=await db.auth.signInWithPassword({email:$('loginEmail').value,password:$('loginPassword').value});if(error)return $('authError').textContent=error.message;const {data:{user}}=await db.auth.getUser();try{await loadProfile(user.id);await loadAll();showApp()}catch(err){$('authError').textContent=err.message;await db.auth.signOut()}};$('logoutButton').onclick=async()=>{if(C.DEMO_MODE)return toast('デモモードではログアウト不要です');await db.auth.signOut();showAuth()}}
async function init(){bind();try{if(C.DEMO_MODE){demoLoad();showApp()}else await supaInit()}catch(e){showAuth();$('authError').textContent=e.message||'初期化に失敗しました'}}
document.readyState==='loading'?document.addEventListener('DOMContentLoaded',init):init();
})();
</script></body></html>
