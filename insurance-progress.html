<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#164456"><title>保険進捗管理</title><link rel="icon" type="image/png" href="./insurance-progress-favicon.png"><style>

:root{--navy:#0f2c4c;--navy2:#153a62;--blue:#176fb5;--blue-soft:#eaf4fb;--ink:#15202b;--muted:#687581;--line:#dce4ea;--bg:#f3f6f8;--panel:#fff;--green:#1f8f61;--green-soft:#e7f6ef;--orange:#d97706;--orange-soft:#fff3df;--red:#c84444;--red-soft:#fdecec;--purple:#7357b4;--purple-soft:#f0ecfb;--shadow:0 14px 40px rgba(18,39,61,.09);--radius:18px}
*{box-sizing:border-box}html{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg)}body{margin:0;min-width:320px;background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.button{min-height:42px;border-radius:11px;padding:0 17px;border:1px solid transparent;font-weight:800;font-size:13px}.primary{background:var(--navy2);color:#fff}.primary:hover{background:#0d2744}.secondary{background:#fff;border-color:var(--line);color:var(--ink)}.danger{background:var(--red);color:#fff}.icon-button{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;background:#fff;display:grid;place-items:center}.eyebrow{margin:0 0 4px;color:var(--blue);font-size:10px;letter-spacing:.15em;font-weight:900}.muted{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:28px;z-index:200;transform:translate(-50%,18px);opacity:0;visibility:hidden;background:var(--navy);color:#fff;padding:13px 20px;border-radius:12px;font-size:13px;transition:.2s;box-shadow:var(--shadow)}.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
.auth-layer{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:22px;background:linear-gradient(135deg,#0f2c4c,#1b527d)}.auth-card{width:min(430px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:0 30px 90px rgba(0,0,0,.28)}.auth-logo{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--navy2);color:#fff;font-size:23px;font-weight:900}.auth-card h1{margin:18px 0 7px;font-size:25px}.auth-card p{margin:0 0 20px;color:var(--muted);font-size:13px;line-height:1.7}.auth-card label{display:grid;gap:7px;margin-top:12px;font-size:12px;font-weight:800}.auth-card input{min-height:48px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:none}.auth-card input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,111,181,.11)}.auth-card .button{width:100%;margin-top:18px;min-height:50px}.auth-error{min-height:20px;color:var(--red);font-size:12px;margin-top:10px}.demo-badge{position:fixed;right:15px;bottom:15px;z-index:250;padding:8px 11px;border-radius:99px;background:#fff3df;color:#9a5a00;border:1px solid #f4d7a6;font-size:11px;font-weight:900;box-shadow:var(--shadow)}
.config-error{position:fixed;inset:0;z-index:350;display:grid;place-items:center;padding:22px;background:#f3f6f8}.config-card{width:min(600px,100%);padding:28px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.config-card h1{margin:0 0 12px}.config-card code{display:block;padding:13px;border-radius:10px;background:#f0f3f6;white-space:pre-wrap}.config-card p{color:var(--muted);line-height:1.8}

.shell{min-height:100vh}.header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:16px 26px;background:rgba(22,68,86,.98);color:#fff;box-shadow:0 5px 20px rgba(22,68,86,.18)}.brand{display:flex;align-items:center;gap:13px}.brand-mark{width:45px;height:45px;border:1px solid rgba(255,255,255,.48);border-radius:13px;display:grid;place-items:center;font-size:18px;font-weight:900}.brand strong,.brand small{display:block}.brand strong{font-size:14px;letter-spacing:.09em}.brand small{margin-top:4px;color:rgba(255,255,255,.62)}.user-area{display:flex;gap:9px;align-items:center}.user-chip{padding:9px 12px;border-radius:99px;background:rgba(255,255,255,.12);font-size:11px}.logout{border:1px solid rgba(255,255,255,.24);background:transparent;color:#fff;border-radius:10px;padding:8px 11px}.content{max-width:1500px;margin:auto;padding:28px}.heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:20px}.heading h1{margin:3px 0 6px;font-size:29px}.heading p:last-child{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:9px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:17px}.metric{padding:18px;background:#fff;border:1px solid var(--line);border-radius:16px}.metric span{color:var(--muted);font-size:11px}.metric strong{display:block;margin-top:10px;font-size:29px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.toolbar{display:flex;gap:10px;padding:17px;border-bottom:1px solid var(--line)}.search{flex:1;display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:#fbfcfd}.search input{width:100%;height:42px;border:0;outline:0;background:transparent}.filters{display:flex;gap:8px;padding:12px 17px;background:#fbfcfd;border-bottom:1px solid var(--line);flex-wrap:wrap}.filters select{min-height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 30px 0 10px;font-size:12px}.clear{margin-left:auto;border:0;background:transparent;color:var(--blue);font-size:11px;font-weight:900}.result{padding:14px 17px 5px;font-size:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1050px}.table th{padding:12px 14px;text-align:left;color:var(--muted);font-size:10px;background:#fbfcfd;border-bottom:1px solid var(--line)}.table td{padding:14px;border-bottom:1px solid #edf0f2;font-size:12px;vertical-align:middle}.person strong,.person small{display:block}.person small{margin-top:4px;color:var(--muted)}.status{display:inline-flex;align-items:center;padding:6px 9px;border-radius:99px;font-size:10px;font-weight:900}.s-blue{background:var(--blue-soft);color:var(--blue)}.s-orange{background:var(--orange-soft);color:var(--orange)}.s-purple{background:var(--purple-soft);color:var(--purple)}.s-green{background:var(--green-soft);color:var(--green)}.s-red{background:var(--red-soft);color:var(--red)}.s-gray{background:#edf0f2;color:#6b7785}.due.overdue{color:var(--red);font-weight:900}.due.today{color:var(--orange);font-weight:900}.empty{padding:50px;text-align:center;color:var(--muted)}.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,25,40,.4);opacity:0;visibility:hidden}.overlay.open{opacity:1;visibility:visible}.drawer{position:fixed;inset:0 0 0 auto;width:min(550px,100%);z-index:60;background:#fff;transform:translateX(102%);transition:.25s;overflow:auto}.drawer.open{transform:translateX(0)}.drawer-head,.modal-head{padding:19px 21px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.drawer-body{padding:20px}.summary{padding:17px;border-radius:14px;background:#f7fafb}.summary h2{margin:0 0 6px}.summary-top{display:flex;justify-content:space-between;gap:12px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:13px;overflow:hidden;margin:17px 0}.detail-cell{background:#fff;padding:12px}.detail-cell span{display:block;color:var(--muted);font-size:9px;margin-bottom:5px}.drawer-section{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.drawer-section p{color:var(--muted);line-height:1.8;font-size:12px;white-space:pre-wrap}.drawer-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}.modal-backdrop{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:18px;background:rgba(10,25,40,.43);opacity:0;visibility:hidden}.modal-backdrop.open{opacity:1;visibility:visible}.modal{width:min(800px,100%);max-height:calc(100vh - 36px);overflow:auto;background:#fff;border-radius:20px}.modal form{padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid label{display:grid;gap:7px;font-size:11px;font-weight:900}.form-grid input,.form-grid select,.form-grid textarea{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:9px 11px}.form-grid textarea{min-height:125px}.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
@media(max-width:900px){.content{padding:17px}.metrics{grid-template-columns:1fr 1fr}.heading{align-items:start;gap:12px}.user-chip{display:none}}@media(max-width:620px){.metrics{grid-template-columns:1fr}.heading{display:block}.actions{margin-top:12px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}

</style></head><body>
<div id="authLayer" class="auth-layer hidden"><form id="loginForm" class="auth-card"><div class="auth-logo">保</div><h1>保険進捗管理</h1><p>カスタマーサクセス・保険担当者用の管理画面です。</p><label>メールアドレス<input id="loginEmail" type="email" autocomplete="username" required></label><label>パスワード<input id="loginPassword" type="password" autocomplete="current-password" required></label><button class="button primary" type="submit">ログイン</button><div id="authError" class="auth-error"></div></form></div>
<div id="app" class="shell hidden"><header class="header"><div class="brand"><div class="brand-mark">保</div><div><strong>INSURANCE PROGRESS</strong><small>会員ケガ保険 進捗管理</small></div></div><div class="user-area"><span id="userChip" class="user-chip"></span><button id="logoutButton" class="logout">ログアウト</button></div></header><main class="content"><div class="heading"><div><p class="eyebrow">INSURANCE CLAIMS</p><h1>保険進捗管理</h1><p>会員から問い合わせがあった際に、現在の状況と次の対応を確認します。</p></div><div class="actions"><button id="exportButton" class="button secondary">CSV出力</button><button id="newButton" class="button primary">＋ 新規登録</button></div></div><div class="metrics"><div class="metric"><span>対応中</span><strong id="metricOpen">0</strong></div><div class="metric"><span>会員対応待ち</span><strong id="metricMember">0</strong></div><div class="metric"><span>保険会社確認中</span><strong id="metricInsurer">0</strong></div><div class="metric"><span>対応期限超過</span><strong id="metricOverdue">0</strong></div></div><section class="panel"><div class="toolbar"><div class="search">⌕<input id="searchInput" type="search" placeholder="会員氏名、備考、ネクストアクションで検索"></div></div><div class="filters"><select id="storeFilter"><option value="">すべての店舗</option></select><select id="statusFilter"><option value="">すべてのステータス</option></select><select id="dueFilter"><option value="">すべての対応日</option><option value="overdue">期限超過</option><option value="today">本日対応</option><option value="week">7日以内</option><option value="none">日付未設定</option></select><select id="sortFilter"><option value="dueAsc">次回対応日が近い順</option><option value="updatedDesc">最終更新が新しい順</option><option value="injuryDesc">ケガ発生日が新しい順</option><option value="nameAsc">氏名順</option></select><button id="clearButton" class="clear">条件をクリア</button></div><div class="result"><strong id="resultCount">0件</strong> を表示</div><div class="table-wrap"><table class="table"><thead><tr><th>会員氏名</th><th>発生店舗・ケガ発生日</th><th>申請ステータス</th><th>ネクストアクション</th><th>次回対応日</th><th>最終更新</th><th></th></tr></thead><tbody id="tableBody"></tbody></table><div id="emptyState" class="empty hidden">該当する申請はありません。</div></div></section></main></div>
<div id="overlay" class="overlay"></div><aside id="drawer" class="drawer"><div class="drawer-head"><div><p class="eyebrow">CLAIM DETAIL</p><h2>申請詳細</h2></div><button id="drawerClose" class="icon-button">×</button></div><div id="drawerBody" class="drawer-body"></div></aside>
<div id="modalBackdrop" class="modal-backdrop"><section class="modal"><div class="modal-head"><div><p class="eyebrow">CLAIM</p><h2 id="modalTitle">保険申請を登録</h2></div><button id="modalClose" class="icon-button">×</button></div><form id="claimForm"><input id="claimId" type="hidden"><div class="form-grid"><label>会員氏名 <span class="required">*</span><input id="memberName" required></label><label>発生店舗 <span class="required">*</span><select id="storeId" required></select></label><label>ケガ発生日 <span class="required">*</span><input id="injuryDate" type="date" required></label><label>申請ステータス<select id="applicationStatus"></select></label><label class="full">ネクストアクション<input id="nextAction" placeholder="例：保険会社へ進捗確認"></label><label>次回対応日<input id="nextActionDate" type="date"></label><label class="full">備考<textarea id="notes" placeholder="申請内容、不足書類、会員への案内内容など"></textarea></label></div><div class="modal-actions"><button id="cancelButton" type="button" class="button secondary">キャンセル</button><button class="button primary" type="submit">保存する</button></div></form></section></div><div id="toast" class="toast"></div><div id="demoBadge" class="demo-badge hidden">デモモード</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
/* Supabase接続設定：本番接続時は3項目を編集してください。 */
window.APP_CONFIG = {
  // Supabase接続前は true のままで画面を確認できます。
  DEMO_MODE: true,

  // Supabase接続時に入力し、DEMO_MODE を false に変更してください。
  SUPABASE_URL: '',
  SUPABASE_PUBLISHABLE_KEY: '',

  STORAGE_BUCKET: 'lost-item-images',
  TIMEZONE: 'Asia/Tokyo'
};

</script>
<script>
(()=>{'use strict';const C=window.APP_CONFIG||{},$=id=>document.getElementById(id),qsa=s=>[...document.querySelectorAll(s)];let db=null,profile=null,stores=[],claims=[],selected=null;const STATUSES=['未確認','会員へ確認中','必要書類待ち','申請準備中','保険会社へ申請済み','保険会社確認中','追加対応待ち','支払い手続き中','支払い完了','対象外','保留'];const complete=new Set(['支払い完了','対象外']);
const seedStores=[{id:'s1',name:'大阪なんば本店'},{id:'s2',name:'大阪梅田店'},{id:'s3',name:'神戸三宮店'}];const seedClaims=[{id:'cl1',member_name:'山田 太郎',store_id:'s1',injury_date:'2026-07-10',application_status:'保険会社確認中',next_action:'7月17日に保険会社へ進捗確認',next_action_date:'2026-07-17',notes:'診断書と領収書を受領済み。7月14日に保険会社へ申請。',created_at:'2026-07-11T01:00:00Z',updated_at:'2026-07-14T06:30:00Z'},{id:'cl2',member_name:'佐藤 花子',store_id:'s2',injury_date:'2026-07-12',application_status:'必要書類待ち',next_action:'会員へ診断書の提出を案内',next_action_date:'2026-07-15',notes:'領収書のみ受領。',created_at:'2026-07-12T03:00:00Z',updated_at:'2026-07-14T04:20:00Z'},{id:'cl3',member_name:'鈴木 一郎',store_id:'s3',injury_date:'2026-06-28',application_status:'支払い完了',next_action:'対応完了',next_action_date:null,notes:'7月8日に支払い完了を会員へ案内。',created_at:'2026-06-29T03:00:00Z',updated_at:'2026-07-08T05:10:00Z'}];const demoKey='insurance_demo_v3';
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const storeName=id=>stores.find(x=>x.id===id)?.name||'不明';function today(){return new Intl.DateTimeFormat('sv-SE',{timeZone:C.TIMEZONE||'Asia/Tokyo'}).format(new Date())}function fmtDate(v){if(!v)return'—';const [y,m,d]=v.split('-');return`${Number(y)}年${Number(m)}月${Number(d)}日`}function fmtTime(v){if(!v)return'—';return new Intl.DateTimeFormat('ja-JP',{timeZone:C.TIMEZONE||'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function statusClass(s){if(s==='支払い完了')return's-green';if(['対象外','保留'].includes(s))return's-gray';if(['会員へ確認中','必要書類待ち'].includes(s))return's-orange';if(['保険会社へ申請済み','保険会社確認中'].includes(s))return's-purple';if(s==='追加対応待ち')return's-red';return's-blue'}function dueClass(c){if(!c.next_action_date||complete.has(c.application_status))return'';return c.next_action_date<today()?'overdue':c.next_action_date===today()?'today':''}
function demoLoad(){let s={};try{s=JSON.parse(localStorage.getItem(demoKey)||'{}')}catch{}stores=seedStores;claims=s.claims||structuredClone(seedClaims);profile={display_name:'カスタマーサクセス',role:'insurance_manager'};$('demoBadge').classList.remove('hidden')}function demoSave(){localStorage.setItem(demoKey,JSON.stringify({claims}))}
function showAuth(){$('authLayer').classList.remove('hidden');$('app').classList.add('hidden')}function showApp(){$('authLayer').classList.add('hidden');$('app').classList.remove('hidden');applyRole();populate();render()}
async function initSupa(){if(!C.SUPABASE_URL||!C.SUPABASE_PUBLISHABLE_KEY){document.body.innerHTML='<div class="config-error"><div class="config-card"><h1>Supabase設定が必要です</h1><p>HTML内の APP_CONFIG に接続情報を設定してください。</p></div></div>';return}db=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY);const {data:{session}}=await db.auth.getSession();if(!session)return showAuth();await load(session.user.id);showApp()}
async function load(uid){const [p,s,c]=await Promise.all([db.from('profiles').select('display_name,role').eq('id',uid).single(),db.from('master_records').select('id,name').eq('master_type','store').eq('is_active',true).order('sort_order'),db.from('insurance_claims').select('*').order('updated_at',{ascending:false})]);if(p.error)throw p.error;if(!['admin','insurance_manager','customer_success'].includes(p.data.role))throw new Error('このアカウントには保険進捗管理の権限がありません。');if(s.error)throw s.error;if(c.error)throw c.error;profile=p.data;stores=s.data;claims=c.data}
function applyRole(){const edit=['admin','insurance_manager'].includes(profile.role);$('userChip').textContent=(profile.display_name||'ユーザー')+' / '+profile.role;$('newButton').classList.toggle('hidden',!edit);window.canEdit=edit}
function populate(){$('storeFilter').innerHTML='<option value="">すべての店舗</option>'+stores.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');$('storeId').innerHTML='<option value="">選択してください</option>'+stores.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');$('statusFilter').innerHTML='<option value="">すべてのステータス</option>'+STATUSES.map(s=>`<option>${s}</option>`).join('');$('applicationStatus').innerHTML=STATUSES.map(s=>`<option>${s}</option>`).join('')}
function filtered(){let a=[...claims],q=$('searchInput').value.trim().toLowerCase();if(q)a=a.filter(c=>[c.member_name,c.notes,c.next_action,storeName(c.store_id)].join(' ').toLowerCase().includes(q));if($('storeFilter').value)a=a.filter(c=>c.store_id===$('storeFilter').value);if($('statusFilter').value)a=a.filter(c=>c.application_status===$('statusFilter').value);const due=$('dueFilter').value,t=today();if(due==='overdue')a=a.filter(c=>c.next_action_date&&c.next_action_date<t&&!complete.has(c.application_status));if(due==='today')a=a.filter(c=>c.next_action_date===t&&!complete.has(c.application_status));if(due==='week'){const d=new Date(t+'T00:00:00+09:00');d.setDate(d.getDate()+7);const lim=d.toISOString().slice(0,10);a=a.filter(c=>c.next_action_date&&c.next_action_date>=t&&c.next_action_date<=lim&&!complete.has(c.application_status))}if(due==='none')a=a.filter(c=>!c.next_action_date);const sort=$('sortFilter').value;a.sort((x,y)=>sort==='updatedDesc'?new Date(y.updated_at)-new Date(x.updated_at):sort==='injuryDesc'?String(y.injury_date).localeCompare(String(x.injury_date)):sort==='nameAsc'?x.member_name.localeCompare(y.member_name,'ja'):String(x.next_action_date||'9999').localeCompare(String(y.next_action_date||'9999')));return a}
function render(){const a=filtered();$('resultCount').textContent=a.length+'件';$('tableBody').innerHTML=a.map(c=>`<tr data-id="${c.id}"><td><div class="person"><strong>${esc(c.member_name)}</strong><small>${esc(c.id.slice(0,8).toUpperCase())}</small></div></td><td><strong>${esc(storeName(c.store_id))}</strong><br><span class="muted">${fmtDate(c.injury_date)}</span></td><td><span class="status ${statusClass(c.application_status)}">${esc(c.application_status)}</span></td><td>${esc(c.next_action||'未設定')}</td><td><span class="due ${dueClass(c)}">${fmtDate(c.next_action_date)}</span></td><td>${fmtTime(c.updated_at)}</td><td><button class="icon-button">›</button></td></tr>`).join('');$('emptyState').classList.toggle('hidden',a.length>0);qsa('#tableBody tr').forEach(tr=>tr.onclick=()=>openDrawer(tr.dataset.id));metrics()}
function metrics(){const t=today();$('metricOpen').textContent=claims.filter(c=>!complete.has(c.application_status)).length;$('metricMember').textContent=claims.filter(c=>['会員へ確認中','必要書類待ち'].includes(c.application_status)).length;$('metricInsurer').textContent=claims.filter(c=>['保険会社へ申請済み','保険会社確認中'].includes(c.application_status)).length;$('metricOverdue').textContent=claims.filter(c=>c.next_action_date&&c.next_action_date<t&&!complete.has(c.application_status)).length}
function openDrawer(id){selected=claims.find(c=>c.id===id);if(!selected)return;$('drawerBody').innerHTML=`<div class="summary"><div class="summary-top"><div><h2>${esc(selected.member_name)}</h2><p class="muted">${esc(storeName(selected.store_id))} / ケガ発生日 ${fmtDate(selected.injury_date)}</p></div><span class="status ${statusClass(selected.application_status)}">${esc(selected.application_status)}</span></div></div><div class="detail-grid"><div class="detail-cell"><span>ネクストアクション</span><strong>${esc(selected.next_action||'未設定')}</strong></div><div class="detail-cell"><span>次回対応日</span><strong class="due ${dueClass(selected)}">${fmtDate(selected.next_action_date)}</strong></div><div class="detail-cell"><span>最終更新</span><strong>${fmtTime(selected.updated_at)}</strong></div><div class="detail-cell"><span>管理ID</span><strong>${esc(selected.id.slice(0,8).toUpperCase())}</strong></div></div><section class="drawer-section"><h3>備考</h3><p>${esc(selected.notes||'備考はありません。')}</p></section><div class="drawer-actions"><button id="closeDetail" class="button secondary">閉じる</button>${window.canEdit?'<button id="editDetail" class="button primary">内容を更新</button>':''}</div>`;$('overlay').classList.add('open');$('drawer').classList.add('open');$('closeDetail').onclick=closeDrawer;if(window.canEdit)$('editDetail').onclick=()=>{closeDrawer();openModal(selected)}}function closeDrawer(){$('overlay').classList.remove('open');$('drawer').classList.remove('open')}
function openModal(c=null){$('modalTitle').textContent=c?'保険申請を更新':'保険申請を登録';$('claimId').value=c?.id||'';$('memberName').value=c?.member_name||'';$('storeId').value=c?.store_id||'';$('injuryDate').value=c?.injury_date||today();$('applicationStatus').value=c?.application_status||'未確認';$('nextAction').value=c?.next_action||'';$('nextActionDate').value=c?.next_action_date||'';$('notes').value=c?.notes||'';$('modalBackdrop').classList.add('open')}function closeModal(){$('modalBackdrop').classList.remove('open');$('claimForm').reset()}
async function saveClaim(e){e.preventDefault();const id=$('claimId').value,rec={member_name:$('memberName').value.trim(),store_id:$('storeId').value,injury_date:$('injuryDate').value,application_status:$('applicationStatus').value,next_action:$('nextAction').value.trim()||null,next_action_date:$('nextActionDate').value||null,notes:$('notes').value.trim()||null};try{if(C.DEMO_MODE){if(id){Object.assign(claims.find(x=>x.id===id),rec,{updated_at:new Date().toISOString()})}else claims.unshift({id:crypto.randomUUID(),...rec,created_at:new Date().toISOString(),updated_at:new Date().toISOString()});demoSave()}else{const q=db.from('insurance_claims');const {data,error}=id?await q.update(rec).eq('id',id).select().single():await q.insert(rec).select().single();if(error)throw error;if(id)Object.assign(claims.find(x=>x.id===id),data);else claims.unshift(data)}closeModal();render();toast('保存しました')}catch(e){toast(e.message||'保存できませんでした')}}
function exportCsv(){const rows=[['会員氏名','発生店舗','ケガ発生日','申請ステータス','ネクストアクション','次回対応日','備考','最終更新日時'],...filtered().map(c=>[c.member_name,storeName(c.store_id),c.injury_date,c.application_status,c.next_action,c.next_action_date,c.notes,c.updated_at])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='保険進捗管理_'+today()+'.csv';a.click();URL.revokeObjectURL(a.href)}
function bind(){['searchInput'].forEach(id=>$(id).oninput=render);['storeFilter','statusFilter','dueFilter','sortFilter'].forEach(id=>$(id).onchange=render);$('clearButton').onclick=()=>{['searchInput','storeFilter','statusFilter','dueFilter'].forEach(id=>$(id).value='');$('sortFilter').value='dueAsc';render()};$('newButton').onclick=()=>openModal();$('exportButton').onclick=exportCsv;$('drawerClose').onclick=closeDrawer;$('overlay').onclick=closeDrawer;$('modalClose').onclick=closeModal;$('cancelButton').onclick=closeModal;$('claimForm').onsubmit=saveClaim;$('loginForm').onsubmit=async e=>{e.preventDefault();$('authError').textContent='';const {error}=await db.auth.signInWithPassword({email:$('loginEmail').value,password:$('loginPassword').value});if(error)return $('authError').textContent=error.message;const {data:{user}}=await db.auth.getUser();try{await load(user.id);showApp()}catch(err){$('authError').textContent=err.message;await db.auth.signOut()}};$('logoutButton').onclick=async()=>{if(C.DEMO_MODE)return toast('デモモードです');await db.auth.signOut();showAuth()}}
async function init(){bind();try{if(C.DEMO_MODE){demoLoad();showApp()}else await initSupa()}catch(e){showAuth();$('authError').textContent=e.message}}
document.readyState==='loading'?document.addEventListener('DOMContentLoaded',init):init();})();
</script></body></html>
