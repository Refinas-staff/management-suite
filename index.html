<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2c4c">
  <title>管理システム</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f2c4c'/%3E%3Cpath d='M18 18h28v8H18zm0 12h28v8H18zm0 12h20v8H18z' fill='white'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --navy: #0f2c4c;
      --navy-2: #173e68;
      --bg: #f3f6f9;
      --surface: #ffffff;
      --line: #d9e1e8;
      --text: #172331;
      --muted: #667585;
      --shadow: 0 18px 50px rgba(15, 44, 76, .10);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: radial-gradient(circle at top right, #e6eef7 0, transparent 35%), var(--bg);
      color: var(--text);
    }
    .header {
      background: linear-gradient(135deg, var(--navy), var(--navy-2));
      color: #fff;
      padding: 26px 24px;
      box-shadow: 0 8px 24px rgba(15, 44, 76, .18);
    }
    .header-inner, .main { width: min(1040px, calc(100% - 32px)); margin: 0 auto; }
    .eyebrow { margin: 0 0 6px; font-size: 12px; letter-spacing: .16em; opacity: .72; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); letter-spacing: .02em; }
    .lead { margin: 10px 0 0; color: rgba(255,255,255,.8); font-size: 14px; }
    .main { padding: 42px 0 56px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .card {
      display: flex;
      flex-direction: column;
      min-height: 255px;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 24px 60px rgba(15,44,76,.15); border-color: #aebfce; }
    .icon {
      width: 52px; height: 52px; display: grid; place-items: center;
      border-radius: 14px; background: #edf3f8; font-size: 27px; margin-bottom: 20px;
    }
    .card h2 { margin: 0 0 10px; font-size: 20px; }
    .card p { margin: 0; color: var(--muted); line-height: 1.75; font-size: 14px; }
    .open {
      margin-top: auto; padding-top: 24px; font-weight: 700; color: var(--navy-2);
      display: flex; align-items: center; justify-content: space-between;
    }
    .arrow { font-size: 20px; }
    .note {
      margin-top: 24px; padding: 18px 20px; background: rgba(255,255,255,.68);
      border: 1px solid var(--line); border-radius: 14px; color: var(--muted); font-size: 13px; line-height: 1.7;
    }
    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
      .card { min-height: 205px; }
      .main { padding-top: 28px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <p class="eyebrow">MANAGEMENT SYSTEM</p>
      <h1>管理システム</h1>
      <p class="lead">利用する画面を選択してください。</p>
    </div>
  </header>

  <main class="main">
    <div class="grid">
      <a class="card" href="./lost-pc.html">
        <div class="icon" aria-hidden="true">🖥️</div>
        <h2>忘れ物管理・PC</h2>
        <p>忘れ物の検索、詳細確認、ステータス変更、各種マスター設定を行います。</p>
        <div class="open"><span>開く</span><span class="arrow">→</span></div>
      </a>

      <a class="card" href="./lost-ipad.html">
        <div class="icon" aria-hidden="true">📱</div>
        <h2>忘れ物登録・iPad</h2>
        <p>店舗で発見した忘れ物を、写真付きで新規登録する専用画面です。</p>
        <div class="open"><span>開く</span><span class="arrow">→</span></div>
      </a>

      <a class="card" href="./insurance-progress.html">
        <div class="icon" aria-hidden="true">🩹</div>
        <h2>保険進捗管理</h2>
        <p>会員様のケガに関する保険申請状況と、次の対応を確認・更新します。</p>
        <div class="open"><span>開く</span><span class="arrow">→</span></div>
      </a>
    </div>

    <div class="note">
      GitHub PagesのトップURLでは、この <strong>index.html</strong> が自動表示されます。
    </div>
  </main>
</body>
</html>
