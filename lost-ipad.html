 0 5px;font-size:18px}.photo-empty small{color:var(--muted)}.photo-box img{width:100%;height:340px;object-fit:contain;background:#edf2f5}.photo-button{margin-top:15px;min-height:52px;border:0;border-radius:13px;padding:0 23px;background:var(--navy2);color:#fff;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid label{display:grid;gap:8px;min-width:0;font-size:13px;font-weight:900}.grid input,.grid select,.grid textarea{width:100%;min-width:0;max-width:100%;min-height:56px;border:1px solid var(--line);border-radius:13px;padding:12px 14px;font-size:16px;outline:0}.grid textarea{min-height:112px;resize:vertical}.grid input[type="datetime-local"]{inline-size:100%;min-inline-size:0}.fixed-field{pointer-events:none;background:#f3f6f8!important;color:#465563;cursor:default}.grid input:focus,.grid select:focus,.grid textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(23,111,181,.11)}.full{grid-column:1/-1}.required{color:var(--red)}.submit-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:14px max(27px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(27px,env(safe-area-inset-left));background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(12px)}.submit-inner{max-width:1080px;margin:auto;display:flex;justify-content:flex-end;gap:11px}.reset,.submit{min-height:59px;border-radius:15px;padding:0 28px;font-size:16px;font-weight:900}.reset{border:1px solid var(--line);background:#fff}.submit{min-width:290px;border:0;background:var(--navy2);color:#fff;box-shadow:0 10px 26px rgba(21,58,98,.22)}.success{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:24px;background:rgba(10,25,40,.55);opacity:0;visibility:hidden}.success.open{opacity:1;visibility:visible}.success-card{width:min(570px,100%);padding:35px;background:#fff;border-radius:22px;text-align:center}.success-icon{width:70px;height:70px;margin:auto;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green);font-size:34px;font-weight:900}.success-card h2{margin:17px 0 8px}.management-no{margin:20px 0;padding:15px;border-radius:13px;background:var(--blue-soft);color:var(--navy2);font-size:21px;font-weight:900}.next{width:100%;min-height:56px;border:0;border-radius:14px;background:var(--navy2);color:#fff;font-size:16px;font-weight:900}

<div id="authLayer" class="auth-layer hidden"><form id="loginForm" class="auth-card"><div class="auth-logo">＋</div><h1>忘れ物登録</h1><p>iPad登録専用アカウントでログインします。</p><label>メールアドレス<input id="loginEmail" type="email" autocomplete="username" required></label><label>パスワード<input id="loginPassword" type="password" autocomplete="current-password" required></label><button class="button primary" type="submit">ログイン</button><div id="authError" class="auth-error"></div></form></div>
<div id="app" class="hidden"><header class="header"><div class="brand"><div class="brand-mark">＋</div><div><strong>LOST &amp; FOUND</strong><small>iPad 新規登録専用</small></div></div><div class="header-actions"><span id="userChip" class="user-chip"></span><button id="logoutButton" class="logout">ログアウト</button></div></header><main><div class="intro"><div><p class="eyebrow">NEW LOST ITEM</p><h1>忘れ物を登録</h1></div><div class="hint">写真を撮影して必要項目を選択します。<br>登録後は管理番号を現物に付けてください。</div></div><form id="registerForm" class="form-card"><section class="section"><div class="section-title"><div class="step">1</div><div><h2>写真</h2><span>現物を確認しやすい角度で撮影</span></div></div><div id="photoBox" class="photo-box"><input id="photoInput" type="file" accept="image/*" capture="environment" hidden><div id="photoEmpty" class="photo-empty"><div class="camera">◎</div><strong>忘れ物を撮影</strong><small>アップロード前に自動圧縮します</small><button id="photoButton" type="button" class="photo-button">カメラを開く</button></div><img id="photoPreview" alt="忘れ物写真" class="hidden"></div></section><section class="section"><div class="section-title"><div class="step">2</div><div><h2>基本情報</h2><span>店舗と発見日時を入力</span></div></div><div class="grid"><label>店舗 <b class="required">*</b><select id="store" required></select></label><label>発見日時 <b class="required">*</b><input id="foundAt" type="datetime-local" required></label><label>カテゴリ <b class="required">*</b><select id="category" required></select></label><label>品名 <b class="required">*</b><input id="itemName" placeholder="例：黒い折りたたみ傘" required></label><label>色<input id="color" placeholder="例：黒"></label><label>保管期限 <span class="muted">（発見日時から6か月後）</span><input id="expiry" class="fixed-field" type="date" readonly tabindex="-1" aria-readonly="true"></label></div></section><section class="section"><div class="section-title"><div class="step">3</div><div><h2>場所</h2><span>店舗で使用できる場所だけを表示</span></div></div><div class="grid"><label>発見場所 <b class="required">*</b><select id="foundLocation" required></select></label><label>保管場所 <b class="required">*</b><select id="storageLocation" required></select></label></div></section><section class="section"><div class="section-title"><div class="step">4</div><div><h2>特徴・備考</h2><span>ブランド、柄、傷、名前の記載など</span></div></div><div class="grid"><label class="full">特徴<textarea id="features" placeholder="例：持ち手に白いライン。内側に小さなロゴあり。"></textarea></label><label class="full">備考<textarea id="notes" placeholder="必要な場合のみ入力"></textarea></label></div></section></form></main><div class="submit-bar"><div class="submit-inner"><button id="resetButton" class="reset" type="button">リセット</button><button class="submit" form="registerForm" type="submit">この内容で登録する</button></div></div></div>
<div id="success" class="success"><div class="success-card"><div class="success-icon">✓</div><h2>登録しました</h2><p class="muted">現物に下の管理番号を付けて保管してください。</p><div id="managementNo" class="management-no"></div><button id="nextButton" class="next">次の忘れ物を登録</button></div></div><div id="toast" class="toast"></div><div id="demoBadge" class="demo-badge hidden">デモモード</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
/* Supabase接続設定：本番接続時は3項目を編集してください。 */
window.APP_CONFIG = {
  // Supabase接続前は true のままで画面を確認できます。
  DEMO_MODE: true,

  // Supabase接続時に入力し、DEMO_MODE を false に変更してください。
  SUPABASE_URL: '',
  SUPABASE_PUBLISHABLE_KEY: '',

  STORAGE_BUCKET: 'lost-item-images',
  TIMEZONE: 'Asia/Tokyo'
};

</script>
<script>
(()=>{'use strict';const C=window.APP_CONFIG||{},$=id=>document.getElementById(id);let db=null,profile=null,masters=[],settings={},photoBlob=null,photoDataUrl='';
const seed=[{id:'s1',master_type:'store',code:'NMB',name:'大阪なんば本店',parent_id:null,sort_order:10,is_active:true,metadata:{}},{id:'s2',master_type:'store',code:'UMD',name:'大阪梅田店',parent_id:null,sort_order:20,is_active:true,metadata:{}},{id:'c1',master_type:'category',name:'財布・現金',parent_id:null,sort_order:10,is_active:true,metadata:{emoji:'👛'}},{id:'c2',master_type:'category',name:'鍵',parent_id:null,sort_order:20,is_active:true,metadata:{emoji:'🔑'}},{id:'c3',master_type:'category',name:'衣類',parent_id:null,sort_order:30,is_active:true,metadata:{emoji:'👕'}},{id:'c4',master_type:'category',name:'その他',parent_id:null,sort_order:99,is_active:true,metadata:{emoji:'□'}},{id:'f1',master_type:'found_location',name:'受付',parent_id:null,sort_order:10,is_active:true,metadata:{}},{id:'f2',master_type:'found_location',name:'更衣室',parent_id:null,sort_order:20,is_active:true,metadata:{}},{id:'l1',master_type:'storage_location',name:'受付保管棚',parent_id:'s1',sort_order:10,is_active:true,metadata:{}},{id:'l2',master_type:'storage_location',name:'貴重品金庫',parent_id:null,sort_order:20,is_active:true,metadata:{}},{id:'l3',master_type:'storage_location',name:'保管棚A',parent_id:'s2',sort_order:10,is_active:true,metadata:{}}];
const $type=t=>masters.filter(x=>x.master_type===t&&x.is_active).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function tzDate(d=new Date()){return new Intl.DateTimeFormat('sv-SE',{timeZone:C.TIMEZONE||'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}function nowLocal(){const parts=new Intl.DateTimeFormat('sv-SE',{timeZone:C.TIMEZONE||'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const o=Object.fromEntries(parts.map(x=>[x.type,x.value]));return `${o.year}-${o.month}-${o.day}T${o.hour}:${o.minute}`}function addCalendarMonths(dateTimeValue,months=6){const base=(dateTimeValue||nowLocal()).slice(0,10).split('-').map(Number);const y=base[0],m=base[1],d=base[2];const total=(m-1)+months;const targetYear=y+Math.floor(total/12);const targetMonth=(total%12+12)%12;const lastDay=new Date(Date.UTC(targetYear,targetMonth+1,0)).getUTCDate();return `${targetYear}-${String(targetMonth+1).padStart(2,'0')}-${String(Math.min(d,lastDay)).padStart(2,'0')}`}function syncExpiry(){if($('expiry'))$('expiry').value=addCalendarMonths($('foundAt')?.value,6)}
function showAuth(){$('authLayer').classList.remove('hidden');$('app').classList.add('hidden')}function showApp(){$('authLayer').classList.add('hidden');$('app').classList.remove('hidden');$('userChip').textContent=(profile.display_name||'登録端末')+' / '+profile.role;populate();resetForm(true)}
async function initSupabase(){if(!C.SUPABASE_URL||!C.SUPABASE_PUBLISHABLE_KEY){document.body.innerHTML='<div class="config-error"><div class="config-card"><h1>Supabase設定が必要です</h1><p>HTML内の APP_CONFIG に接続情報を設定してください。</p></div></div>';return}db=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY);const {data:{session}}=await db.auth.getSession();if(!session)return showAuth();await load(session.user.id);showApp()}
async function load(uid){const [p,m,s]=await Promise.all([db.from('profiles').select('display_name,role').eq('id',uid).single(),db.from('master_records').select('*').eq('is_active',true).order('sort_order'),db.from('app_settings').select('key,value')]);if(p.error)throw p.error;if(!['admin','lost_register','lost_manager'].includes(p.data.role))throw new Error('このアカウントには忘れ物登録権限がありません。');if(m.error)throw m.error;profile=p.data;masters=m.data;settings=Object.fromEntries((s.data||[]).map(x=>[x.key,x.value]))}
function populate(){const opts=a=>'<option value="">選択してください</option>'+a.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('store').innerHTML=opts($type('store'));$('category').innerHTML=opts($type('category'));populateLocations()}
function populateLocations(){const sid=$('store').value;const allowed=t=>$type(t).filter(x=>!x.parent_id||x.parent_id===sid);const opts=a=>'<option value="">選択してください</option>'+a.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('foundLocation').innerHTML=opts(allowed('found_location'));$('storageLocation').innerHTML=opts(allowed('storage_location'))}
async function loadImage(file){if('createImageBitmap'in window){try{return await createImageBitmap(file)}catch{}}return await new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('画像を読み込めません'))};img.src=url})}async function compress(file){const img=await loadImage(file);const max=Number(settings.image_max_px||1200);const scale=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);if(img.close)img.close();const quality=Number(settings.image_quality||.75);return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('画像を圧縮できません')),'image/jpeg',quality))}
async function choosePhoto(file){if(!file)return;try{photoBlob=await compress(file);photoDataUrl=URL.createObjectURL(photoBlob);$('photoPreview').src=photoDataUrl;$('photoPreview').classList.remove('hidden');$('photoEmpty').classList.add('hidden');toast('写真を圧縮しました')}catch(e){toast('写真を読み込めませんでした')}}
async function uploadPhoto(storeId){if(!photoBlob)return null;const d=new Date(),uuid=crypto.randomUUID();const path=`${storeId}/${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${uuid}.jpg`;const {error}=await db.storage.from(C.STORAGE_BUCKET||'lost-item-images').upload(path,photoBlob,{contentType:'image/jpeg',upsert:false});if(error)throw error;return path}
function demoManagementNo(){const store=masters.find(x=>x.id===$('store').value);const day=new Date().toISOString().slice(0,10).replaceAll('-','');return`${store?.code||'STR'}-${day}-${String(Math.floor(Math.random()*999)+1).padStart(3,'0')}`}
async function submit(e){e.preventDefault();const button=document.querySelector('.submit');button.disabled=true;button.textContent='登録中…';try{const rec={store_id:$('store').value,category_id:$('category').value,found_location_id:$('foundLocation').value,storage_location_id:$('storageLocation').value,found_at:new Date($('foundAt').value).toISOString(),expiry_date:addCalendarMonths($('foundAt').value,6),item_name:$('itemName').value.trim(),color:$('color').value.trim()||null,features:$('features').value.trim()||null,notes:$('notes').value.trim()||null,status:'保管中'};let no;if(C.DEMO_MODE){no=demoManagementNo();const list=JSON.parse(localStorage.getItem('lost_ipad_demo_items')||'[]');list.unshift({...rec,id:crypto.randomUUID(),management_no:no,photo_data:photoDataUrl,created_at:new Date().toISOString()});localStorage.setItem('lost_ipad_demo_items',JSON.stringify(list))}else{rec.photo_path=await uploadPhoto(rec.store_id);const {data,error}=await db.from('lost_items').insert(rec).select('management_no').single();if(error)throw error;no=data.management_no}$('managementNo').textContent=no;$('success').classList.add('open')}catch(err){toast(err.message||'登録できませんでした')}finally{button.disabled=false;button.textContent='この内容で登録する'}}
function resetForm(keepStore=false){const store=keepStore?$('store').value:'';$('registerForm').reset();$('store').value=store;$('foundAt').value=nowLocal();syncExpiry();photoBlob=null;if(photoDataUrl)URL.revokeObjectURL(photoDataUrl);photoDataUrl='';$('photoPreview').src='';$('photoPreview').classList.add('hidden');$('photoEmpty').classList.remove('hidden');populateLocations()}
function bind(){$('photoButton').onclick=()=>$('photoInput').click();$('photoInput').onchange=e=>choosePhoto(e.target.files[0]);$('store').onchange=populateLocations;$('foundAt').addEventListener('input',syncExpiry);$('foundAt').addEventListener('change',syncExpiry);$('registerForm').onsubmit=submit;$('resetButton').onclick=()=>resetForm(false);$('nextButton').onclick=()=>{$('success').classList.remove('open');resetForm(true)};$('loginForm').onsubmit=async e=>{e.preventDefault();$('authError').textContent='';const {error}=await db.auth.signInWithPassword({email:$('loginEmail').value,password:$('loginPassword').value});if(error)return $('authError').textContent=error.message;const {data:{user}}=await db.auth.getUser();try{await load(user.id);showApp()}catch(err){$('authError').textContent=err.message;await db.auth.signOut()}};$('logoutButton').onclick=async()=>{if(C.DEMO_MODE)return toast('デモモードです');await db.auth.signOut();showAuth()}}
async function init(){bind();if('serviceWorker'in navigator)navigator.serviceWorker.register('./lost-ipad-sw.js').catch(()=>{});try{if(C.DEMO_MODE){masters=structuredClone(seed);settings={normal_retention_days:90,image_max_px:1200,image_quality:.75};profile={display_name:'店舗iPad',role:'lost_register'};$('demoBadge').classList.remove('hidden');showApp()}else await initSupabase()}catch(e){showAuth();$('authError').textContent=e.message}}
document.readyState==='loading'?document.addEventListener('DOMContentLoaded',init):init();})();
</script></body></html>
